openapi: 3.1.0
info:
  title: Agent Arena API
  version: 0.1.0
  description: >
    Server-owned agent sessions for three-agent Agent Arena turns. Clients select
    only allowlisted model, harness, and card IDs. Provider credentials and raw
    tool targets never cross this API.
servers:
  - url: http://127.0.0.1:8790
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "403":
          $ref: "#/components/responses/Error"
  /readyz:
    get:
      security: []
      operationId: readiness
      responses:
        "200":
          description: Process is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "403":
          $ref: "#/components/responses/Error"
  /v1/capabilities:
    get:
      operationId: getCapabilities
      responses:
        "200":
          description: Public aliases, configuration state, and feature modes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/runs:
    post:
      operationId: createRun
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run created or replayed for the same idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRunResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/agents/{agentId}/loadout:
    put:
      operationId: updateAgentLoadout
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Loadout"
      responses:
        "200":
          description: Current agent loadout.
          content:
            application/json:
              schema:
                type: object
                required:
                  [runId, agentId, arenaSessionId, generation, loadout]
                properties:
                  runId:
                    type: string
                  agentId:
                    type: string
                  arenaSessionId:
                    type: string
                  generation:
                    type: integer
                  loadout:
                    $ref: "#/components/schemas/Loadout"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/turns:
    post:
      operationId: createTurn
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTurnRequest"
      responses:
        "202":
          description: Turn durably queued or replayed.
          content:
            application/json:
              schema:
                type: object
                required: [turnId, status, replayed, eventsUrl]
                properties:
                  turnId:
                    type: string
                  status:
                    $ref: "#/components/schemas/TurnStatus"
                  replayed:
                    type: boolean
                  eventsUrl:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/turns/{turnId}:
    get:
      operationId: getTurn
      parameters:
        - $ref: "#/components/parameters/TurnId"
      responses:
        "200":
          description: Authoritative current or terminal turn result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/turns/{turnId}/events:
    get:
      operationId: streamTurnEvents
      description: >
        Replays persisted events strictly after Last-Event-ID and then follows the
        live stream. The `after` query parameter is an equivalent browser-friendly
        cursor when Last-Event-ID is absent. The terminal event is replayed before
        the connection closes.
      parameters:
        - $ref: "#/components/parameters/TurnId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
        - name: after
          in: query
          required: false
          description: >
            Replay events strictly after this non-negative safe-integer sequence.
            Last-Event-ID takes precedence when both cursors are supplied.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
      responses:
        "200":
          description: SSE stream using integer event IDs.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/agents/{agentId}/compact:
    post:
      operationId: compactAgentContext
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Compact result. Native and fallback modes are explicit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextMutationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/agents/{agentId}/clear:
    post:
      operationId: clearAgentContext
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: A new per-agent context session generation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextMutationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    TurnId:
      name: turnId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Sanitized error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
    FeatureCapabilities:
      type: object
      additionalProperties: false
      required: [streaming, functionTools, remoteMcp, skills, compaction]
      properties:
        streaming:
          type: boolean
        functionTools:
          type: boolean
        remoteMcp:
          type: boolean
        skills:
          type: boolean
        compaction:
          type: boolean
    ModelCapability:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - provider
        - implemented
        - configured
        - liveVerified
        - supports
        - compactModes
        - unavailableReasons
      properties:
        id:
          type: string
        displayName:
          type: string
        provider:
          enum: [mock, openai, anthropic]
        implemented:
          type: boolean
        configured:
          type: boolean
        liveVerified:
          type: boolean
        supports:
          $ref: "#/components/schemas/FeatureCapabilities"
        compactModes:
          type: array
          items:
            enum: [native, explicit-summary-fallback, mock-native]
        unavailableReasons:
          type: array
          items:
            type: string
    RegistryCardSummary:
      type: object
      additionalProperties: false
      required: [id, version, displayName]
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 1
        displayName:
          type: string
    RegistrySkillSummary:
      type: object
      additionalProperties: false
      required: [id, version, displayName, kind]
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 1
        displayName:
          type: string
        kind:
          enum: [instruction, function, hosted]
        configuredProviders:
          type: object
          additionalProperties: false
          required: [openai, anthropic]
          properties:
            openai:
              type: boolean
            anthropic:
              type: boolean
    RegistryMcpSummary:
      type: object
      additionalProperties: false
      required: [id, version, displayName, readOnly, configured]
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 1
        displayName:
          type: string
        readOnly:
          type: boolean
          const: true
        configured:
          type: boolean
    Harness:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - maxInputTokens
        - maxOutputTokens
        - maxToolCalls
        - timeoutMs
        - fallbackActionId
        - contextSoftLimitRatio
        - contextHardLimitRatio
      properties:
        id:
          type: string
        displayName:
          type: string
        maxInputTokens:
          type: integer
          minimum: 1
        maxOutputTokens:
          type: integer
          minimum: 1
        maxToolCalls:
          type: integer
          minimum: 0
        timeoutMs:
          type: integer
          minimum: 1
        fallbackActionId:
          type: string
        contextSoftLimitRatio:
          type: number
          minimum: 0
          maximum: 1
        contextHardLimitRatio:
          type: number
          minimum: 0
          maximum: 1
    Registry:
      type: object
      additionalProperties: false
      required: [promptCards, skillCards, mcpCards, harnesses]
      properties:
        promptCards:
          type: array
          items:
            $ref: "#/components/schemas/RegistryCardSummary"
        skillCards:
          type: array
          items:
            $ref: "#/components/schemas/RegistrySkillSummary"
        mcpCards:
          type: array
          items:
            $ref: "#/components/schemas/RegistryMcpSummary"
        harnesses:
          type: array
          items:
            $ref: "#/components/schemas/Harness"
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [modelProfiles, cardsVersion, limits, registry]
      properties:
        modelProfiles:
          type: array
          items:
            $ref: "#/components/schemas/ModelCapability"
        cardsVersion:
          type: string
        limits:
          type: object
          additionalProperties: false
          required: [partySize, maxConcurrentTurnsPerRun]
          properties:
            partySize:
              type: integer
              const: 3
            maxConcurrentTurnsPerRun:
              type: integer
              const: 1
        registry:
          $ref: "#/components/schemas/Registry"
    Loadout:
      type: object
      additionalProperties: false
      required: [promptCardIds, skillCardIds, mcpCardIds]
      properties:
        promptCardIds:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        skillCardIds:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        mcpCardIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    PartyAgent:
      type: object
      additionalProperties: false
      required: [agentId, promptCardIds, skillCardIds, mcpCardIds]
      properties:
        agentId:
          type: string
          minLength: 1
          maxLength: 64
        promptCardIds:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        skillCardIds:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        mcpCardIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [modelProfileId, harnessId, party]
      properties:
        modelProfileId:
          type: string
          minLength: 1
          maxLength: 64
        harnessId:
          type: string
          minLength: 1
          maxLength: 64
        party:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/PartyAgent"
    CreateRunResponse:
      type: object
      additionalProperties: false
      required:
        [runId, modelProfileId, cardsVersion, replayed, agents]
      properties:
        runId:
          type: string
        modelProfileId:
          type: string
        cardsVersion:
          type: string
        replayed:
          type: boolean
        agents:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [agentId, arenaSessionId, generation]
            properties:
              agentId:
                type: string
              arenaSessionId:
                type: string
              generation:
                type: integer
    AllowedAction:
      type: object
      additionalProperties: false
      required: [actionId, targetIds]
      properties:
        actionId:
          type: string
          minLength: 1
          maxLength: 64
        targetIds:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    CreateTurnRequest:
      type: object
      additionalProperties: false
      required: [stageId, turnNumber, event, allowedActions]
      properties:
        stageId:
          type: string
          minLength: 1
          maxLength: 128
        turnNumber:
          type: integer
          minimum: 1
        event:
          type: object
          additionalProperties: false
          required: [type, summary, publicState]
          properties:
            type:
              type: string
              minLength: 1
              maxLength: 64
            summary:
              type: string
              minLength: 1
              maxLength: 2000
            publicState:
              type: object
              additionalProperties: true
        allowedActions:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/AllowedAction"
    TurnStatus:
      enum: [queued, running, completed, failed]
    AgentDecision:
      type: object
      additionalProperties: false
      required:
        [actionId, targetId, speech, reasonSummary, attributedCardIds]
      properties:
        actionId:
          type: string
        targetId:
          type: [string, "null"]
        speech:
          type: string
          maxLength: 160
        reasonSummary:
          type: string
          maxLength: 240
        attributedCardIds:
          type: array
          uniqueItems: true
          items:
            type: string
    TokenUsage:
      type: object
      additionalProperties: false
      required:
        - inputTokens
        - cachedInputTokens
        - outputTokens
        - reasoningTokens
        - totalTokens
        - source
      properties:
        inputTokens:
          type: integer
          minimum: 0
        cachedInputTokens:
          type: [integer, "null"]
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        reasoningTokens:
          type: [integer, "null"]
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
        source:
          enum: [provider_measured, mock_measured, unavailable]
    ContextTelemetry:
      type: object
      additionalProperties: false
      required:
        - estimatedActiveTokens
        - budgetTokens
        - gauge
        - measurement
        - compactedThisTurn
      properties:
        estimatedActiveTokens:
          type: integer
          minimum: 0
        budgetTokens:
          type: integer
          minimum: 1
        gauge:
          type: number
          minimum: 0
          maximum: 1
        measurement:
          enum: [estimated, estimated_after_output, measured_input]
        compactedThisTurn:
          type: boolean
        compactionMode:
          enum: [native, explicit-summary-fallback, mock-native]
    ToolTrace:
      type: object
      additionalProperties: false
      required: [type, name, status]
      properties:
        type:
          enum: [function, mcp, skill]
        name:
          type: string
        status:
          enum: [started, completed, failed]
        durationMs:
          type: integer
          minimum: 0
        safeSummary:
          type: string
    AgentTurnResult:
      type: object
      additionalProperties: false
      required:
        - agentId
        - arenaSessionId
        - decision
        - usage
        - context
        - toolTrace
        - latencyMs
        - fallbackUsed
        - traceId
      properties:
        agentId:
          type: string
        arenaSessionId:
          type: string
        decision:
          $ref: "#/components/schemas/AgentDecision"
        usage:
          $ref: "#/components/schemas/TokenUsage"
        context:
          $ref: "#/components/schemas/ContextTelemetry"
        toolTrace:
          type: array
          items:
            $ref: "#/components/schemas/ToolTrace"
        latencyMs:
          type: integer
          minimum: 0
        fallbackUsed:
          type: boolean
        fallbackReason:
          type: string
        traceId:
          type: string
    TurnResponse:
      type: object
      additionalProperties: false
      required: [turnId, runId, status, results, createdAt]
      properties:
        turnId:
          type: string
        runId:
          type: string
        status:
          $ref: "#/components/schemas/TurnStatus"
        results:
          type: array
          items:
            $ref: "#/components/schemas/AgentTurnResult"
        failureReason:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    ContextMutationResponse:
      type: object
      additionalProperties: false
      required: [runId, agentId, arenaSessionId, generation, context, replayed]
      properties:
        runId:
          type: string
        agentId:
          type: string
        arenaSessionId:
          type: string
        generation:
          type: integer
        compactionMode:
          enum: [native, explicit-summary-fallback, mock-native]
        context:
          $ref: "#/components/schemas/ContextTelemetry"
        replayed:
          type: boolean
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, traceId]
          properties:
            code:
              type: string
            message:
              type: string
            traceId:
              type: string
            details:
              type: object
              additionalProperties: true
