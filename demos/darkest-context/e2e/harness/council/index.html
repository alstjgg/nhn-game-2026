<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline empty icon, same reason as the demo home: a missing /favicon.ico would
         404 and the zero-console-errors gate would fail on it. -->
    <link rel="icon" href="data:," />
    <title>Council Harness — Darkest Context</title>
  </head>
  <body>
    <!--
      u11's OWN render surface. index.html and src/main.ts are u1-owned and frozen for
      this unit, so the 평의회 tile gets this standalone page instead. It is picked up
      automatically by the e2e/harness/*/index.html glob in vite.config.ts — no shared
      file is edited to add it.

      Nothing outside the screen is interactive: the "no intervention" gate counts every
      pressable element inside [data-testid="council-screen"], and this page must not
      tempt anyone into adding a second one next to it.
    -->
    <div id="harness"></div>
    <script type="module" src="./main.ts"></script>
  </body>
