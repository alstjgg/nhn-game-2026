<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline empty icon, same reason as the demo home: a missing /favicon.ico would
         404 and the zero-console-errors gate would fail on it. -->
    <link rel="icon" href="data:," />
    <title>Equip Harness — Darkest Context</title>
  </head>
  <body>
    <!--
      u12's OWN render surface. index.html and src/main.ts are u1-owned and frozen for
      this unit, so the 훈련장 and 휴식 screens get this standalone page instead. It is
      picked up automatically by the e2e/harness/*/index.html glob in vite.config.ts —
      no shared file is edited to add it.

      BOTH screens mount here, side by side. That is what makes A9 observable: the 휴식
      screen owns every context readout on the page, and a full 훈련장 draft → assign
      runs alongside them without moving a single number.
    -->
    <div id="harness"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
