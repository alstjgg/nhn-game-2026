version = 0.1

# Copied from apothecary-llm-layer's shape. Differences: new stack name and new
# physical resources (§3.6), and no [elevated] profile — that existed only to
# rewrite the execution role when AllowedProfileMode changed, and DDAY has no
# such parameter (haiku is bound by the game spec, so the IAM policy is fixed).
# The artifact bucket and the CloudFormation execution role are the EXISTING
# bootstrap stack's, reused rather than duplicated.

[default.deploy.parameters]
stack_name = "nhn-game-dday-proxy"
region = "ap-northeast-2"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = false
s3_bucket = "nhn-game-llm-artifacts-141840355276-ap-northeast-2"
s3_prefix = "nhn-game-dday-proxy"
role_arn = "arn:aws:iam::141840355276:role/nhn-game-llm-cloudformation-exec"
fail_on_empty_changeset = false
parameter_overrides = "AllowedOrigin=\"https://alstjgg.github.io\" MaxTokens=\"2048\" ModelTimeoutMs=\"7000\" MaxBodyBytes=\"131072\" ReservedConcurrency=\"-1\" ThrottlingRateLimit=\"2\" ThrottlingBurstLimit=\"4\""
