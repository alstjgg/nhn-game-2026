name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress run (Pages is a deliverable).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Each demo under demos/<slug>/ that has its own package.json is built and
      # published at /<slug>/ (subpath-safe via each demo's `base: './'`).
      # Auto-discovered: a new demo (e.g. darkest-context) deploys the moment it
      # has a package.json — no edits here. A demo build failure fails the deploy
      # on purpose (a deliverable that can't build should be loud); Pages keeps the
      # last successful deploy, so the live root site never breaks meanwhile.
      - name: Build demos into subpaths
        env:
          APOTHECARY_AI_BASE_URL: https://zcyeajmv11.execute-api.ap-northeast-2.amazonaws.com
        run: |
          shopt -s nullglob
          for demo in demos/*/; do
            [ -f "${demo}package.json" ] || continue
            slug="$(basename "$demo")"
            echo "::group::Build demo ${slug}"
            if [ "$slug" = "apothecary" ]; then
              (cd "$demo" && npm ci && VITE_AI_BASE_URL="$APOTHECARY_AI_BASE_URL" npm run build)
            else
              (cd "$demo" && npm ci && npm run build)
            fi
            mkdir -p "dist/${slug}"
            cp -r "${demo}dist/." "dist/${slug}/"
            echo "::endgroup::"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
