name: CI

# Every gate in the repo, on every PR. Before this existed the only workflow that
# ran anything was deploy.yml — push-to-main only, root + demos only — so the
# proxy's 36 tests, including the prompt-parity gate that is the sole thing
# holding up "the mechanism measurements describe the deployed system", ran only
# when a human remembered to run them locally.
#
# Nothing here deploys. deploy.yml stays the only path to Pages (CLAUDE.md rule 3),
# and is left untouched; the overlap on push-to-main is one cheap duplicate build.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Root: tsc over src/ (both configs) + the datapack type-drift check.
  # Node 22 matches deploy.yml — this job is the browser bundle's gate, so it
  # runs on the version that actually builds the deliverable.
  root:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth-1 checkout. A large part of this
      # suite measures assertions against GIT RANGES rather than the live tree —
      # that is the C17 discipline: a unit-scoped claim that later work has
      # legitimately outgrown gets re-aimed at the range where it stays true,
      # never deleted. `tests/scaffold/layout.test.ts` resolves u0's own merge
      # (`git log --merges --grep`), `deps.test.ts` reads `package.json` as of
      # u0, and the frozen-path and RED-time-hash guards diff against their unit's
      # base. On a shallow clone none of that history exists and they fail with
      # "the u0 merge is not reachable from HEAD".
      #
      # This was masked, not absent: `--exclude 'tests/scaffold/layout.test.ts'`
      # hid the loudest one, and dropping that exclude is what surfaced the rest.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # `npm run check` (above) is tsc + datapack:check + tools/tests' node:test
      # checks only — it never invokes vitest, so the tests under tests/** (engine,
      # composer, transport, driver, runloop, client, invariants, acceptance) gated
      # nothing until this step. The `--exclude` that used to sit here is gone:
      # u0's empty-modules census was retired at the engine run and the remaining
      # scaffold gates are re-aimed, so the whole suite runs.
      - run: npm test
      # A16 and A17. `deploy.yml` already runs `npm run build`, but only on push
      # to main — i.e. after a merge, which is too late to gate one. The probe's
      # self-test ran in no job at all: `tools/probe/**` is a frozen input this
      # build must not break, and nothing was checking. Both are cheap and
      # offline (no key, no network).
      - run: npm run build
      - run: npm run probe:selftest

  # Preview smoke: the production bundle, served, with `preview-smoke.spec.ts`
  # run against it — the one check that the artifact the judges load boots.
  # Short, and it carries none of the desk's window-stacking races.
  #
  # It is no longer the ONLY Playwright job; see `desk` below.
  preview-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # PW_LANE=preview keeps Playwright from booting all three webServer
      # lanes: it starts every entry in the array regardless of `--project`,
      # so without the gate this job pays for a dev-mode build, a dev server
      # and the real build — the config filters the array on this variable.
      - run: npx playwright test --project=preview
        env:
          CI: '1'
          PW_LANE: preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # THE DESK — the ~200 chromium tests, and the reason this job exists (08-09).
  #
  # The full suite was manual by 민서's call on #116, on the reasoning that the
  # preview smoke covers the artifact and the rest carries window-stacking
  # races. What that left is a green tick that says nothing about the desk: in
  # one week `main` went red twice and stayed red, both times in tests no
  # workflow ran. #219 landed a test asserting the fanfold has printed at boot
  # while #218 had just made it empty until DEPLOY — each branch green alone,
  # neither re-run against the other. Then #224 moved the allotment 5 → 4 and
  # missed a literal in a spec, which the preview lane happened to catch only
  # because the drift was in ITS file. A suite nobody runs is a suite that
  # documents intentions rather than behaviour.
  #
  # It is a SEPARATE job on purpose. It shares nothing with `preview-smoke`, so
  # the artifact check still reports in ~1m whatever the desk does, and a desk
  # failure never masks a bundle failure. `PW_LANE=unit` keeps it to the one
  # lane it needs — the config boots every webServer entry otherwise.
  #
  # Two things had to be true before this could be turned on, and both now are:
  # `e2e/fixtures/harness.ts`'s `awaitRecordFinal` no longer asks for 40 s inside
  # a 30 s test budget (it declares its own), and `preview-smoke.spec.ts` no
  # longer pins the allotment it was never testing.
  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
        env:
          CI: '1'
          PW_LANE: unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-desk
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Proxy: prompt-bundle drift + typecheck + 36 tests, all offline (no AWS, no
  # Bedrock credentials needed — that is the point of the mocked provider).
  #
  # Node 24, not 22: the Lambda runtime is nodejs24.x and proxy/package.json pins
  # `engines.node >= 24`. Installing this tier on 22 is what proxy/.npmrc now
  # refuses outright.
  proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      - run: npm run check
