<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=1280" />
    <title>ERR-2 · 멈춘 회전문 — 운영자 단말</title>
  </head>
  <body>
    <!--
      [u3#c9] The shell containers only. Every piece of run data — portal
      identity, the case, the clock, the D-DAY, the taskbar and the five
      windows — is written by `src/client/shell/`, so nothing here stands in
      for something the driver or the scenario pack owns.
      Ported from docs/design/phase2-ui/index.html (wallpaper 14..55,
      topbar 56..104, overlays 279..284); the third-party webfont links are
      dropped (inv 10 — u10 self-hosts) and the window markup is built at
      runtime because its geometry comes from applyLayout, never from markup.
      The wallpaper is no longer a VERBATIM port of 14..55 — x10 dropped the
      blueprint's four text labels, for the reason recorded on the `.bp` group
      below. The design file keeps them; it is history, not the target.
    -->
    <div id="app">
      <a class="skip-link" href="#desktop">본문(데스크)으로 건너뛰기</a>

      <!-- ══ WALLPAPER ═══════════════════════════════════════════════ -->
      <div id="wallpaper" aria-hidden="true">
        <svg id="blueprint" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M40 0H0V40" fill="none" stroke="var(--blueprint)" stroke-width=".5" />
            </pattern>
            <pattern id="gridfine" width="8" height="8" patternUnits="userSpaceOnUse">
              <path d="M8 0H0V8" fill="none" stroke="var(--blueprint)" stroke-width=".3" />
            </pattern>
          </defs>
          <rect width="1600" height="900" fill="url(#gridfine)" opacity=".3" />
          <rect width="1600" height="900" fill="url(#grid)" opacity=".5" />
          <!-- A structural elevation — a long span on two towers, drawn as
               dressing and nothing else. It names no place, no contractor and
               no defect, which is the whole point of it: it is the paper the
               desk happens to be standing on, not a document in the case.

               x10 (민서, 08-10) — it USED to name all three. Four
               `<text class="bplabel">` nodes rode this group: two callouts on
               the deck naming a span and an anchorage each, a title block up
               at the tower line carrying the structure's name, its scale and
               its contractor, and a red warning beside the `.mark` circle
               naming the failure. Every word of it belonged to the FIRST
               scenario concept — the bridge — which the project dropped for
               the pack it actually ships (`PACK_SLUG` in `shell/pack.ts`; the
               case is a tunnel). A wallpaper that captions a case the desk is
               not running is worse than an unlabelled one, and it is also the
               shell standing in for something the scenario pack owns, which
               this block's opening line says nothing here does.

               So the labels are gone and the DRAWING is untouched: every path,
               both grid patterns, both `<rect>` fills and the pulsing `.mark`
               circle stay exactly as they were. 민서 asked for the text
               stripped and the screen otherwise left alone, and chose the
               option that keeps the circle — it is drawing, not text, and it
               is now the only thing on the wallpaper that points at anything.
               `.bplabel` / `.bplabel.warn` went with the nodes in
               `styles/shell.css`, and `[u3#c9] (f)` in
               `tests/shell/shell-source.test.ts` holds the line — which is why
               the dropped strings are DESCRIBED above and quoted nowhere: (f)
               scans this file's comments too, on purpose. The verbatim four are
               in the design file and in git. -->
          <g class="bp" transform="translate(0,120)">
            <path d="M60 560 L1540 560" />
            <path d="M60 566 L1540 566" class="thin" />
            <path d="M240 560 L240 300 M800 560 L800 240 M1360 560 L1360 300" />
            <path d="M240 300 Q520 470 800 250 Q1080 470 1360 300" class="cable" />
            <path d="M240 300 Q520 470 800 250 Q1080 470 1360 300" class="cable2" />
            <g class="hang">
              <path d="M300 560 V330" /><path d="M370 560 V368" /><path d="M440 560 V400" />
              <path d="M510 560 V424" /><path d="M580 560 V436" /><path d="M650 560 V430" />
              <path d="M720 560 V400" /><path d="M790 560 V255" /><path d="M860 560 V330" />
              <path d="M930 560 V400" /><path d="M1000 560 V430" /><path d="M1070 560 V436" />
              <path d="M1140 560 V424" /><path d="M1210 560 V400" /><path d="M1280 560 V368" />
            </g>
            <path d="M60 620 H1540" class="dim" />
            <path d="M60 610 V630 M800 610 V630 M1540 610 V630" class="dim" />
            <circle cx="800" cy="560" r="26" class="mark" />
          </g>
        </svg>
        <div id="horizon"></div>
      </div>

      <!-- ══ EVIDENCE THREADS (u8 draws into this host) ══════════════ -->
      <svg id="threads" aria-hidden="true"></svg>

      <!-- ══ TOP BAR ═════════════════════════════════════════════════ -->
      <header id="topbar">
        <div class="tb-row tb-row-1">
          <div class="tb-identity">
            <span class="seal-emblem" aria-hidden="true">
              <svg viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="18" />
                <circle cx="20" cy="20" r="14.5" />
                <text x="20" y="25.5" text-anchor="middle">緊</text>
              </svg>
            </span>
            <span class="tb-portal">
              <b id="portalName"></b>
              <i id="portalCode"></i>
            </span>
            <span class="tb-sep"></span>
            <span class="tb-op">
              <em>OPERATOR</em>
              <b id="opName"></b>
              <i id="opClearance"></i>
            </span>
            <span class="tb-sep"></span>
            <span class="tb-case">
              <em>CASE</em><b id="caseName"></b>
            </span>
          </div>

          <div class="tb-clock" id="clockUnit">
            <div class="clk-face">
              <span class="clk-lead">SIM</span>
              <span class="clk-digits" id="clockDigits"></span>
            </div>
            <!-- W4 — the transport controls are gone. The day is not something
                 the operator scrubs; it is something they commit a file to and
                 then watch. DEPLOY starts it, the terminal minute ends it. What
                 is left here is the slot the audio toggle mounts into
                 (`shell/boot.ts`).

                 x6 — the progress bar is gone too, and so is the `→ 23:12`
                 gutter that was its right end. The digits now read the LIVE
                 FEED's latest PRINTED stamp (`shell/feed-clock.ts`), while the
                 fill measured `driver.clock`'s own running minute against the
                 band: one box, two times, and the faster one drawn as the
                 authority. The chrome follows the paper now, so the face and
                 the mute toggle are all that is left — one row, not a stack. -->
            <div class="clk-rate"></div>
          </div>

          <!-- x6 — the two lines swapped languages, because they were naming
               two different things. `D-DAY −02` counts down to a date, and this
               unit counts ATTEMPTS: the day is re-run, it does not approach. The
               figure is what the operator reads under pressure, so it is now
               spelled in the language they read the rest of the paper in, and
               the Latin line above it joins OPERATOR / CASE as the rail of
               small caps that says what the field is. Ids untouched —
               `#ddayNum` is `components/run-counter.ts`'s and the pips are the
               same strip. -->
          <div class="tb-dday" id="ddayUnit">
            <div class="dd-label">REMAINING ATTEMPTS</div>
            <div class="dd-value">잔여 시행 <span id="ddayNum"></span></div>
            <div class="dd-runs"><span id="runNum"></span> / <span id="runTotal"></span></div>
            <div class="dd-pips" id="ddayPips"></div>
          </div>
        </div>

        <nav class="tb-row tb-row-2" id="taskbar" aria-label="열린 창"></nav>
      </header>

      <!-- ══ DESKTOP — display:contents, one stacking context ════════ -->
      <main id="desktop"></main>

      <!-- ══ OVERLAY HOSTS (u8 draws into these) ═════════════════════ -->
      <div id="grain" aria-hidden="true"></div>
      <div id="vignette" aria-hidden="true"></div>
      <div id="sweep" aria-hidden="true"></div>

      <div id="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
